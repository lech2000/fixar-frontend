<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>ФиксАРик — вход через Telegram</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<style>
  :root { color-scheme: light dark; }
  body { margin:0; min-height:100vh; display:grid; place-items:center;
    padding:24px; font:15px/1.55 ui-sans-serif,system-ui,-apple-system,
    "Segoe UI",Roboto,sans-serif; background:#faf7f2; color:#22201c; }
  @media (prefers-color-scheme:dark) {
    body { background:#14130f; color:#e8e3d8; }
  }
  .card { max-width:480px; text-align:center; }
  .seal { width:42px; height:42px; margin:0 auto 14px; border-radius:50%;
    border:1px solid #a8813f; display:grid; place-items:center;
    color:#a8813f; font-weight:700; }
  h1 { margin:0 0 8px; font-size:20px; font-weight:650; }
  p { margin:0 0 14px; opacity:.78; }
  a { color:#a8813f; }
  .actions { display:flex; flex-wrap:wrap; justify-content:center; gap:10px;
    margin-top:18px; }
  .action { appearance:none; border:1px solid #a8813f; border-radius:10px;
    padding:10px 14px; background:#a8813f; color:#fff; cursor:pointer;
    font:inherit; text-decoration:none; }
  .action.secondary { background:transparent; color:#a8813f; }
  .error { color:#b4483a; }
  /* У .actions свой display — без этого правила [hidden] проигрывает ему,
     и кнопки видны до завершения входа. */
  [hidden] { display:none !important; }
</style>
</head>
<body>
<!-- Вход из Телеграм-двойников MAX-ботов (@fixarik_bot, @do_mashkin_bot).
     Та же ручка /auth/max/finish, что у MAX: мессенджер назван самим
     одноразовым билетом, а не этой страницей — страница не выбирает, куда
     вести запись. Решение владельца 13.09.2026: Домашкин в Телеграме
     по шагам; 14.09.2026 — «чтобы включался без Макса»: полная настройка
     открывается и из Телеграма. -->
<main class="card">
  <div class="seal">Ф</div>
  <h1 id="head">Входим через Telegram…</h1>
  <p id="text">Проверяем одноразовую ссылку из личного чата.</p>
  <p><a id="back" href="/" hidden>Вернуться на agrigate.pro</a></p>
  <p class="actions" id="domashkinActions" hidden>
    <button class="action" id="returnToTelegram" type="button">Вернуться в Telegram</button>
    <a class="action secondary" href="/fixclo/?preset=education.domashkin&amp;channel=tg&amp;pilot=domashkin">Открыть настройку Домашкина</a>
  </p>
</main>
<script>
(function () {
  "use strict";
  var API = "https://api.agrigate.pro";
  var head = document.getElementById("head");
  var text = document.getElementById("text");
  var back = document.getElementById("back");
  var domashkinActions = document.getElementById("domashkinActions");
  var returnToTelegram = document.getElementById("returnToTelegram");
  var FALLBACK_NEXT = "/v2/?from=fixarik&channel=tg&new_case=1";
  var DOMASHKIN_TG_GUIDED_NEXT = "/fixclo/?preset=education.domashkin&channel=tg&pilot=domashkin";

  function fail(message) {
    head.textContent = "Вход не завершён";
    head.className = "error";
    text.textContent = message;
    back.hidden = false;
  }

  function safeNext(value) {
    if (typeof value !== "string" || !value || value.length > 1024) return FALLBACK_NEXT;
    try {
      var target = new URL(value, location.origin);
      if (target.origin !== location.origin) return FALLBACK_NEXT;
      var destination = target.pathname + target.search;
      return destination === FALLBACK_NEXT || destination === DOMASHKIN_TG_GUIDED_NEXT
        ? destination : FALLBACK_NEXT;
    } catch (e) {
      return FALLBACK_NEXT;
    }
  }

  // Билет лежит во фрагменте: браузер не посылает его CDN и веб-серверу.
  var fragment = new URLSearchParams(location.hash.slice(1));
  var ticket = fragment.get("ticket") || "";
  history.replaceState(null, "", location.pathname);
  if (!/^[A-Za-z0-9_-]{32,256}$/.test(ticket)) {
    fail("Ссылка неполная. В Telegram отправьте боту /setup и откройте новую.");
    return;
  }

  fetch(API + "/auth/max/finish", {
    method: "POST",
    headers: {"Content-Type": "application/json"},
    body: JSON.stringify({ticket: ticket})
  }).then(function (response) {
    return response.text().then(function (raw) {
      var data;
      try { data = raw ? JSON.parse(raw) : {}; }
      catch (e) { data = {detail: raw}; }
      if (!response.ok) {
        throw new Error(typeof data.detail === "string"
          ? data.detail : "Ссылка не сработала (HTTP " + response.status + ")");
      }
      return data;
    });
  }).then(function (d) {
    if (!d.token) throw new Error("Сервис входа не выдал сессию");
    try {
      localStorage.setItem("fixar.token", d.token);
      localStorage.setItem("fixar.start.token", d.token);
    } catch (e) {
      throw new Error("Браузер запретил сохранить вход");
    }
    head.textContent = d.outcome === "created" ? "Запись создана" : "Вы вошли";
    if (d.flow === "domashkin_guided_setup") {
      /* С 14.09.2026 Домашкин включается и без MAX (решение владельца).
         Вход из его Телеграм-двойника ведёт в ту же полную настройку, что из
         MAX. Адрес — только известный: страница не ведёт туда, куда ей скажут. */
      head.textContent = "Telegram подключён";
      text.textContent = "Открываем настройку Домашкина…";
      var guidedNext = DOMASHKIN_TG_GUIDED_NEXT;
      setTimeout(function () { location.replace(guidedNext); }, 500);
      return;
    }
    if (d.flow === "domashkin_telegram_basic") {
      // Прежний ответ службы (до выкладки 14.09.2026) — пусть не оборвётся.
      head.textContent = "Telegram подключён";
      text.textContent = "Откройте настройку Домашкина, чтобы включить его в этом чате.";
      domashkinActions.hidden = false;
      return;
    }
    text.textContent = "Telegram подключён. Открываем создание первого дела с Фиксариком…";
    var next = safeNext(d.next);
    setTimeout(function () { location.replace(next); }, 700);
  }).catch(function (error) {
    fail(error.message || "Не удалось войти. В Telegram отправьте боту /setup и повторите.");
  });

  returnToTelegram.addEventListener("click", function () {
    window.close();
    head.textContent = "Вернитесь в чат с Домашкиным";
    text.textContent = "Если вкладка не закрылась автоматически, закройте её вручную.";
    domashkinActions.hidden = true;
  });
})();
</script>
</body>
</html>
