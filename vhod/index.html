<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ФиксАР — вход</title>
<!-- РАЗВИЛКА, А НЕ СТРАНИЦА. Здесь ничего не показывают: адрес читается и
     человек уходит на свой вход. Из выдачи закрыто — показывать поисковику
     пустой перенаправитель незачем. -->
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="no-referrer">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/vhod/vhod.css">
</head>
<body>

<!--
  ═══ ЧЕТЫРЕ ВХОДА — ЧЕТЫРЕ ОТДЕЛЬНЫЕ СТРАНИЦЫ ═══

  Решение владельца по карте сайта. Раньше это была ОДНА страница с четырьмя
  лицами: разбор фрагмента и ветвление внутри. Разница не косметическая.

  Отдельные страницы можно раздавать разными ссылками, закрывать от выдачи
  по-разному (у практика и передачи в адресе ключ — им noindex обязателен; у
  поиска и совета ключа нет, и прятать их от выдачи было бы вредно), писать
  под каждую свой текст и считать по каждой отдельно. Одна страница не умеет
  ничего из этого.

    /vhod/praktik/#<ключ>     вопрос специалисту по его личной ссылке
    /vhod/peredacha/#trn_...  вам передают вещь
    /vhod/poisk/#<запрос>     пришли из поиска с готовой задачей
    /vhod/sovet/              посоветовали — общий вход, ветка = ствол

  ЭТА СТРАНИЦА ОСТАЁТСЯ РАЗВИЛКОЙ. Ссылки вида /vhod/#... уже названы в
  докладах и могли уйти дальше; ломать их ради стройности неправильно.
  Развилка стоит копейки и держит слово, данное каждой выданной ссылке.

  ПЕРЕНАПРАВЛЕНИЕ — `location.replace`, а не `href`: иначе кнопка «назад»
  возвращала бы человека на развилку, та снова бросала бы его вперёд, и выйти
  назад стало бы невозможно.

  ФРАГМЕНТ ПЕРЕЕЗЖАЕТ ЦЕЛИКОМ и на сервер по-прежнему не уходит.
-->

<script>
(function () {
  "use strict";
  var ф = (location.hash || "").replace(/^#\/?/, "").trim();
  var куда;
  if (ф.indexOf("trn_") === 0) {
    // Приставку `trn_` выдаёт сама служба передачи — ни у одного другого
    // входа фрагмент так не начинается.
    куда = "/vhod/peredacha/#" + ф;
  } else if (ф) {
    // Всё остальное непустое — ключ страницы практика. Он и был исходным
    // смыслом фрагмента у /vhod/, так что старые ссылки попадают куда надо.
    куда = "/vhod/praktik/#" + ф;
  } else {
    // Пусто — общий вход. Поиск сюда не приводит: у него свой адрес.
    куда = "/vhod/sovet/";
  }
  location.replace(куда);
})();
</script>

<noscript>
  <!-- БЕЗ СКРИПТА РАЗВИЛКА РАБОТАТЬ НЕ МОЖЕТ: фрагмент читается только в
       браузере, на сервер он не уходит по замыслу. Значит человеку надо
       сказать словами и дать дойти руками. -->
  <main class="stage"><div class="col">
    <h1>Вход</h1>
    <p class="sub">Похоже, в браузере выключены скрипты — сам я вас дальше не
      проведу. Выберите вход:</p>
    <div class="pills">
      <a class="pill" href="/vhod/sovet/">Мне посоветовали ФиксАР</a>
      <a class="pill" href="/vhod/poisk/">Я пришёл с задачей</a>
    </div>
    <p class="sub">Ссылка от специалиста и код передачи работают только со
      скриптами.</p>
  </div></main>
</noscript>

</body>
</html>
