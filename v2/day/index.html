<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f7f6f2">
  <meta name="robots" content="noindex,nofollow">
  <title>FixAR · Мой день</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <script>
    try {
      const savedAppearance = JSON.parse(localStorage.getItem("fixar.day.prototype.v1") || "null");
      document.documentElement.dataset.theme = savedAppearance?.theme === "dark" ? "dark" : "light";
    } catch (_) {
      document.documentElement.dataset.theme = "light";
    }
  </script>
  <link rel="stylesheet" href="./day.css">
  <script type="module" src="./day.js"></script>
</head>
<body>
  <a class="skip" href="#main">К содержанию / Skip to content</a>
  <div id="app"></div>
  <dialog id="modal" aria-labelledby="modal-title"></dialog>
  <div id="announcement" class="sr-only" role="status" aria-live="polite"></div>
  <noscript>Для интерактивного прототипа включите JavaScript. This prototype requires JavaScript.</noscript>
</body>
</html>
