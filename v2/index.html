<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#071c26">
  <title>ФиксАР — v2 (навигатор архитектуры)</title>
  <style>
    :root{
      color-scheme: dark;
      --bg:#06151d; --panel:rgba(10,35,45,.88); --panel-2:rgba(7,27,36,.93);
      --line:rgba(156,222,229,.18); --line-soft:rgba(156,222,229,.10);
      --text:#f1f7f7; --muted:#9bb5bb;
      --cyan:#62e6f2; --green:#6ce497; --amber:#ffc86a; --focus:#8fe9f4;
      --radius:18px; --dur:150ms; --ease:cubic-bezier(.2,0,0,1);
      --nav-w: 320px;
    }
    *{box-sizing:border-box}
    html,body{height:100%}
    body{
      margin:0; color:var(--text);
      font:15px/1.5 Inter, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      background:
        radial-gradient(circle at 88% 4%, rgba(20,81,92,.35), transparent 40rem),
        radial-gradient(circle at 2% 96%, rgba(54,51,107,.28), transparent 34rem),
        linear-gradient(160deg,#06151d,#09242d 60%,#071720);
    }
    a{color:inherit;text-decoration:none}
    button{font:inherit;color:inherit}

    /* Каркас */
    .app{ display:grid; grid-template-columns:var(--nav-w) 1fr; height:100vh; height:100dvh; }
    .side{
      display:flex; flex-direction:column; min-height:0;
      border-right:1px solid var(--line-soft);
      background:linear-gradient(180deg,rgba(8,28,37,.7),rgba(6,20,27,.55));
      -webkit-backdrop-filter:blur(8px); backdrop-filter:blur(8px);
    }
    .brand{ display:flex; align-items:center; gap:10px; padding:16px 16px 10px }
    .brand-mark{ display:grid;place-items:center;width:34px;height:34px;border-radius:10px;
      background:linear-gradient(145deg,#78ef9f,#1ab25a);box-shadow:0 0 20px rgba(67,224,130,.25);font-size:21px }
    .brand b{ font-size:17px; font-weight:850 } .brand span{ color:var(--muted); font-size:12px; margin-left:auto }
    .search{ padding:6px 14px 12px }
    .search input{ width:100%; padding:10px 12px; border:1px solid var(--line); border-radius:12px;
      background:#081e27; color:var(--text); outline:none }
    .search input:focus{ border-color:var(--cyan); box-shadow:0 0 0 3px rgba(98,230,242,.1) }
    nav{ overflow:auto; padding:4px 8px 20px; flex:1; min-height:0; -webkit-overflow-scrolling:touch }
    .n-row{ display:flex; align-items:center; gap:2px; border-radius:9px }
    .n-row:hover{ background:rgba(255,255,255,.03) }
    .n-row.active{ background:rgba(98,230,242,.12) }
    .n-row.active > .n-label{ color:var(--text) }
    .caret{ width:22px;height:28px;flex:0 0 22px;border:0;background:none;color:var(--muted);cursor:pointer;
      display:grid;place-items:center;border-radius:7px;transition:transform var(--dur) }
    .caret[aria-expanded="true"]{ transform:rotate(90deg) }
    .caret.leaf{ visibility:hidden }
    .n-label{ flex:1; text-align:left; border:0; background:none; cursor:pointer; padding:6px 6px;
      color:var(--muted); font-size:13.5px; border-radius:7px; }
    .n-row.active .n-label, .n-label:hover{ color:var(--text) }
    .kids{ margin-left:12px; border-left:1px solid var(--line-soft); padding-left:4px }
    .kids[hidden]{ display:none }
    button:focus-visible, a:focus-visible, input:focus-visible{ outline:2px solid var(--focus); outline-offset:2px }

    /* Контент */
    .view{ overflow:auto; min-height:0; -webkit-overflow-scrolling:touch }
    .vwrap{ width:min(1180px,100%); margin:0 auto; padding:22px clamp(16px,3vw,40px) 60px }
    .crumbs{ display:flex; flex-wrap:wrap; gap:6px; color:var(--muted); font-size:13px; margin-bottom:12px }
    .crumbs a{ color:var(--muted) } .crumbs a:hover{ color:var(--cyan) }
    .crumbs .sep{ opacity:.5 }
    .vhead h1{ margin:0; font-size:clamp(24px,3.2vw,38px); letter-spacing:-.02em; line-height:1.08 }
    .vhead .eyebrow{ margin:0 0 4px; color:var(--cyan); font-size:12px; font-weight:800; letter-spacing:.14em; text-transform:uppercase }
    .vhead p{ color:var(--muted); margin:10px 0 0; max-width:64ch }

    .tiles{ display:grid; grid-template-columns:repeat(auto-fill,minmax(260px,1fr)); gap:12px; margin-top:22px }
    .tile{ display:grid; grid-template-columns:1fr 18px; align-items:center; gap:12px; padding:16px 18px;
      border:1px solid var(--line); border-radius:var(--radius);
      background:linear-gradient(155deg,var(--panel),var(--panel-2)); box-shadow:0 12px 30px rgba(0,0,0,.25);
      transition:border-color var(--dur) var(--ease), transform var(--dur) var(--ease); cursor:pointer; text-align:left; width:100% }
    .tile:hover{ transform:translateY(-2px); border-color:rgba(98,230,242,.4) }
    .tile h3{ margin:0 0 2px; font-size:15.5px } .tile p{ margin:0; color:var(--muted); font-size:12.5px }
    .tile .chev{ color:var(--muted) } .tile:hover .chev{ color:var(--cyan) }
    .tile .count{ color:var(--muted); font-size:12px; margin-left:6px }

    /* Дашборд «Главная» */
    .dash{ display:grid; grid-template-columns:1.1fr .95fr .95fr; gap:14px; margin-top:22px }
    .card{ display:flex; flex-direction:column; border:1px solid var(--line); border-radius:var(--radius);
      background:linear-gradient(155deg,var(--panel),var(--panel-2)); box-shadow:0 14px 34px rgba(0,0,0,.28); overflow:hidden; min-height:150px }
    .card .ch{ padding:16px 16px 8px } .card .ch .eyebrow{ margin:0 0 3px; color:var(--cyan); font-size:11px; font-weight:800; letter-spacing:.13em; text-transform:uppercase }
    .card .ch h2{ margin:0; font-size:16px } .card .cb{ padding:4px 16px 16px; color:var(--muted); font-size:13px; flex:1 }
    .row{ display:flex; justify-content:space-between; gap:10px; padding:9px 0; border-bottom:1px solid var(--line-soft) }
    .row:last-child{ border-bottom:0 } .row b{ color:var(--text); font-weight:600; font-size:13.5px }
    .chip{ padding:3px 8px; border-radius:999px; background:rgba(108,228,151,.11); color:var(--green); font-size:11px; white-space:nowrap }
    .bubble{ padding:11px 13px; border-radius:14px; background:rgba(30,72,83,.55); color:#dce9eb; font-size:13px; margin:2px 0 10px }
    .composer{ margin-top:auto; display:grid; grid-template-columns:1fr 42px; gap:8px; padding-top:8px }
    .composer input{ padding:10px 12px; border:1px solid var(--line); border-radius:12px; background:#081e27; color:var(--text); outline:none; min-width:0 }
    .composer button{ border:0; border-radius:12px; background:var(--cyan); color:#06202a; font-weight:900; cursor:pointer }
    .friendly-home .quick-jumps{ display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:10px; margin:16px 0 6px }
    .quick-jump{ min-height:76px; padding:13px 14px; text-align:left; border:1px solid var(--line); border-radius:15px; background:linear-gradient(150deg,rgba(98,230,242,.10),rgba(255,255,255,.025)); color:var(--text); cursor:pointer }
    .quick-jump:hover{ border-color:var(--cyan) } .quick-jump b{ display:block; font-size:15px } .quick-jump span{ display:block; margin-top:4px; color:var(--muted); font-size:12px }
    .friendly-home .dash{ grid-template-columns:1.25fr 1fr 1fr; margin-top:16px }
    .friendly-home .b-dialog .bubble{ padding:15px; font-size:15px; line-height:1.45 }
    .friendly-home .b-dialog .composer{ grid-template-columns:1fr 56px; gap:10px; padding-top:12px }
    .friendly-home .b-dialog .composer input{ min-height:58px; padding:14px 16px; border-radius:15px; font-size:16px }
    .friendly-home .b-dialog .composer button{ border-radius:15px; font-size:19px }
    .metrics{ display:grid; grid-template-columns:repeat(3,1fr); gap:10px; margin-top:14px }
    .metric{ padding:12px 14px; border:1px solid var(--line); border-radius:14px; background:rgba(7,27,36,.6) }
    .metric b{ display:block; font-size:18px } .metric span{ color:var(--muted); font-size:12px }

    /* Заглушка листа */
    .stub{ margin-top:22px; padding:22px; border:1px dashed var(--line); border-radius:var(--radius); background:rgba(7,27,36,.4) }
    .stub .tag{ display:inline-block; padding:4px 10px; border-radius:999px; background:rgba(98,230,242,.1); color:var(--cyan); font-size:12px; margin-bottom:10px }
    .stub p{ color:var(--muted); margin:6px 0 0 }

    /* Богатые экраны */
    .btn{ display:inline-flex;align-items:center;gap:8px;padding:11px 18px;border-radius:13px;border:1px solid var(--line);
      background:rgba(255,255,255,.03);color:var(--text);cursor:pointer;font-weight:650;font-size:14px;transition:border-color var(--dur),filter var(--dur) }
    .btn:hover{ border-color:var(--cyan) } .btn.primary{ background:var(--cyan);color:#06202a;border-color:transparent } .btn.primary:hover{ filter:brightness(1.06) }
    .btn.thinking,.btn.thinking:disabled{ cursor:wait;opacity:1;background:linear-gradient(110deg,#62e6f2 20%,#d9fbff 45%,#62e6f2 70%);background-size:220% 100%;animation:shimmer 1.15s linear infinite;color:#06202a }
    .hero{ padding:8px 0 2px } .hero h1{ margin:6px 0 0;font-size:clamp(30px,4.4vw,52px);letter-spacing:-.035em;line-height:1.03 }
    .hero .lead{ margin:14px 0 0;max-width:62ch;color:var(--muted);font-size:17px }
    .cta-row{ display:flex;flex-wrap:wrap;gap:10px;margin-top:22px }
    .section-t{ margin:32px 0 12px;font-size:12px;font-weight:800;letter-spacing:.13em;text-transform:uppercase;color:var(--muted) }
    .feat{ display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px }
    .feat .card{ min-height:auto;padding:16px;cursor:pointer } .feat .card:hover{ border-color:rgba(98,230,242,.4) }
    .tabs{ display:flex;flex-wrap:wrap;gap:8px;margin:16px 0 14px }
    .tab{ padding:8px 14px;border-radius:999px;border:1px solid var(--line);background:rgba(255,255,255,.03);color:var(--muted);cursor:pointer;font-size:13px }
    .tab.active{ background:rgba(98,230,242,.14);border-color:rgba(98,230,242,.4);color:var(--text) }
    .pgrid{ display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px }
    .pcard{ display:flex;flex-direction:column;gap:8px;padding:16px;border:1px solid var(--line);border-radius:var(--radius);text-align:left;
      background:linear-gradient(155deg,var(--panel),var(--panel-2));cursor:pointer;transition:border-color var(--dur),transform var(--dur);width:100% }
    .pcard:hover{ transform:translateY(-2px);border-color:rgba(98,230,242,.4) }
    .pico{ width:40px;height:40px;border-radius:11px;display:grid;place-items:center;background:rgba(98,230,242,.1);color:var(--cyan);font-weight:800 }
    .pcard h3{ margin:0;font-size:15.5px } .pcard p{ margin:0;color:var(--muted);font-size:12.5px;flex:1 }
    .pmeta{ display:flex;flex-wrap:wrap;gap:12px;align-items:center;color:var(--muted);font-size:12px } .stars{ color:var(--amber) }
    .pack-head{ display:flex;gap:16px;align-items:flex-start;flex-wrap:wrap;margin-top:6px }
    .pack-head .big{ width:64px;height:64px;border-radius:16px;display:grid;place-items:center;background:linear-gradient(145deg,#78ef9f,#1ab25a);font-size:28px;font-weight:800;color:#06202a }
    .perm{ display:flex;gap:10px;align-items:center;padding:11px 0;border-bottom:1px solid var(--line-soft);color:var(--muted);font-size:13.5px }
    .perm b{ color:var(--text);font-weight:600 } .perm .dot{ width:8px;height:8px;border-radius:50%;background:var(--amber);flex:0 0 8px }
    .stepper{ display:flex;flex-wrap:wrap;gap:8px;margin:16px 0 6px }
    .step{ display:flex;gap:8px;align-items:center;padding:8px 12px;border:1px solid var(--line);border-radius:999px;color:var(--muted);font-size:13px }
    .step .num{ width:22px;height:22px;border-radius:50%;display:grid;place-items:center;background:rgba(255,255,255,.05);font-size:12px;font-weight:700 }
    .step.active{ border-color:rgba(98,230,242,.45);color:var(--text) } .step.active .num{ background:var(--cyan);color:#06202a }
    .step.done .num{ background:var(--green);color:#06202a }
    .case-tabs{ display:flex;flex-wrap:wrap;gap:6px;margin:18px 0 14px;border-bottom:1px solid var(--line-soft);padding-bottom:10px }
    .ct{ padding:7px 12px;border-radius:10px;background:none;border:0;color:var(--muted);cursor:pointer;font-size:13.5px }
    .ct.active{ background:rgba(98,230,242,.12);color:var(--text) }
    /* Скоуп-оболочка */
    .switch{ padding:2px 12px 10px } .switch .sw-label{ color:var(--muted);font-size:11px;letter-spacing:.1em;text-transform:uppercase;margin:0 4px 6px }
    .sw-row{ display:grid;grid-template-columns:1fr 1fr;gap:6px } .sw{ padding:8px 10px;border:1px solid var(--line);border-radius:11px;background:rgba(255,255,255,.03);color:var(--muted);cursor:pointer;font-size:13px }
    .sw.on{ background:rgba(98,230,242,.14);border-color:rgba(98,230,242,.4);color:var(--text);font-weight:600 } .sw:hover{ border-color:var(--cyan) }
    .nav-div{ margin:14px 8px 4px;color:var(--muted);font-size:11px;letter-spacing:.12em;text-transform:uppercase;opacity:.75 }
    .protofoot{ padding:8px 10px 16px;border-top:1px solid var(--line-soft) }
    .foot-link{ display:block;width:100%;text-align:left;padding:6px 8px;border:0;background:none;color:var(--muted);cursor:pointer;font-size:12.5px;border-radius:7px } .foot-link:hover{ color:var(--cyan);background:rgba(255,255,255,.03) }
    .chip.warn{ background:rgba(255,200,106,.14);color:var(--amber) }
    .chip.info{ background:rgba(98,230,242,.12);color:var(--cyan) } .chip.done{ background:rgba(255,255,255,.06);color:var(--muted) }
    .minmetrics{ display:flex;flex-wrap:wrap;gap:18px } .minmetrics>div>b{ display:block;font-size:18px;color:var(--text) } .minmetrics>div>span{ color:var(--muted);font-size:12px }
    .lbar{ display:flex;flex-wrap:nowrap;gap:8px;align-items:center;margin:14px 0 }
    .lbar.sticky{ position:sticky;top:0;z-index:5;background:linear-gradient(180deg,rgba(6,20,27,.97),rgba(6,20,27,.9));-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);padding:8px 0;margin:6px 0 12px }
    .filter-bar{ flex:1 1 auto;min-width:0;display:flex;gap:8px;overflow-x:auto;flex-wrap:nowrap;scrollbar-width:none;-webkit-overflow-scrolling:touch } .filter-bar::-webkit-scrollbar{ display:none }
    .filter-bar .tab{ white-space:nowrap;display:inline-flex;align-items:center;gap:6px }
    .tcount{ background:rgba(255,255,255,.08);border-radius:999px;padding:1px 7px;font-size:11px;color:var(--muted) } .filter-bar .tab.active .tcount{ background:rgba(6,32,42,.5);color:var(--text) }
    .create-btn{ margin-left:auto;white-space:nowrap;flex:0 0 auto }
    .lst{ border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;background:linear-gradient(155deg,var(--panel),var(--panel-2)) }
    .lrow{ display:grid;grid-template-columns:1fr auto auto;gap:14px;align-items:center;padding:14px 16px;border:0;border-bottom:1px solid var(--line-soft);cursor:pointer;color:inherit;text-align:left;width:100%;background:none }
    .lrow:last-child{ border-bottom:0 } .lrow:hover{ background:rgba(98,230,242,.05) }
    .lrow h4{ margin:0;font-size:14.5px } .lrow p{ margin:2px 0 0;color:var(--muted);font-size:12.5px } .lrow .when{ color:var(--muted);font-size:12.5px;white-space:nowrap }
    .popen{ margin-top:2px;color:var(--cyan);font-size:13px;font-weight:600 } .pcard:hover .popen{ text-decoration:underline }
    .flow{ display:grid;grid-template-columns:repeat(4,1fr);gap:12px }
    .flow-step{ position:relative;display:flex;gap:10px;align-items:flex-start;padding:14px;border:1px solid var(--line);border-radius:var(--radius);background:linear-gradient(155deg,var(--panel),var(--panel-2)) }
    .flow-n{ flex:0 0 26px;width:26px;height:26px;border-radius:50%;display:grid;place-items:center;background:var(--cyan);color:#06202a;font-weight:800;font-size:13px }
    .flow-step b{ font-size:14px } .flow-step p{ margin:3px 0 0;color:var(--muted);font-size:12.5px }
    .flow-arrow{ position:absolute;right:-9px;top:50%;transform:translateY(-50%);color:var(--muted);z-index:1;font-size:18px }
    @media (max-width:900px){ .flow{ grid-template-columns:1fr } .flow-arrow{ display:none } }
    @media (max-width:760px){ .crumbs{ display:none } .vhead .eyebrow{ font-size:10px } }
    .me{ display:flex;align-items:center;gap:10px;padding:2px 14px 12px } .me-label{ color:var(--muted);font-size:11px;letter-spacing:.1em;text-transform:uppercase } .me-space{ font-size:16px;font-weight:800 }
    .me-av{ margin-left:auto;width:36px;height:36px;border-radius:50%;display:grid;place-items:center;border:1px solid var(--line);background:var(--panel);font-weight:700;font-size:12px }
    .foot-link.dim{ opacity:.55;font-size:12px } .sp-link{ color:var(--text) } .sp-link:hover{ color:var(--cyan) }
    body.nav-open{ overflow:hidden }
    .pv-badge{ position:fixed; top:10px; right:12px; z-index:60; padding:6px 12px; border-radius:999px; background:rgba(255,200,106,.16); color:var(--amber); border:1px solid rgba(255,200,106,.4); font-size:12px; font-weight:700; pointer-events:none }
    @media (max-width:760px){ .pv-badge{ top:auto; bottom:12px; right:12px } }
    /* Экран дела (P1) */
    .kv{ border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;background:linear-gradient(155deg,var(--panel),var(--panel-2)) }
    .kvr{ display:grid;grid-template-columns:200px 1fr;gap:14px;padding:13px 16px;border-bottom:1px solid var(--line-soft) } .kvr:last-child{ border-bottom:0 }
    .kvr .k{ color:var(--muted);font-size:13px } .kvr .v{ font-size:14px }
    .thread2{ display:flex;flex-direction:column;gap:10px;max-width:640px } .thread2 .bubble{ max-width:100% }
    .done-mark{ margin-top:8px;color:var(--green);font-size:12.5px;font-weight:600 }
    .stage{ margin-bottom:14px;border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;background:linear-gradient(155deg,var(--panel),var(--panel-2)) }
    .stage-h{ padding:12px 16px;font-weight:700;border-bottom:1px solid var(--line-soft);font-size:14px }
    .task{ display:grid;grid-template-columns:14px 1fr auto;gap:12px;align-items:center;padding:12px 16px;border-bottom:1px solid var(--line-soft) } .task:last-child{ border-bottom:0 }
    .tstat{ width:11px;height:11px;border-radius:50% } .tstat.done{ background:var(--green) } .tstat.waiting{ background:var(--amber) } .tstat.todo{ background:rgba(156,222,229,.35) }
    .tmain b{ font-size:14px } .tmain span{ display:block;color:var(--muted);font-size:12px }
    .btn.small{ padding:7px 12px;font-size:12.5px }
    .prow{ display:flex;justify-content:space-between;gap:12px;align-items:flex-start;padding:14px 16px;border-bottom:1px solid var(--line-soft) } .prow:last-child{ border-bottom:0 } .prow b{ font-size:14px }
    .perm-tags{ display:flex;flex-wrap:wrap;gap:6px;margin-top:6px } .ptag{ padding:3px 8px;border-radius:999px;background:rgba(98,230,242,.08);color:#bfeef4;font-size:11px }
    .pform{ margin-top:12px;display:flex;flex-direction:column;gap:12px;max-width:680px }
    .pf-row{ display:grid;grid-template-columns:1fr 1fr;gap:12px } .pf-row label,.pform>label{ display:flex;flex-direction:column;gap:6px;font-size:12.5px;color:var(--muted) }
    .pform input,.pform select{ padding:10px 12px;border:1px solid var(--line);border-radius:11px;background:#081e27;color:var(--text);outline:none;font:inherit } .pform input:focus,.pform select:focus{ border-color:var(--cyan) }
    .book-upload{ margin-top:18px;padding:16px;border:1px solid var(--line);border-radius:var(--radius);background:linear-gradient(155deg,var(--panel),var(--panel-2)) }
    .book-upload h3{ margin:0 0 4px;font-size:16px }.book-upload p{ margin:0;color:var(--muted);font-size:13px }
    .book-file{ display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:12px;border:1px dashed rgba(98,230,242,.4);border-radius:12px;background:rgba(98,230,242,.05);cursor:pointer;color:var(--text) }
    .book-file input{ position:absolute;width:1px;height:1px;opacity:0;pointer-events:none }.book-file-name{ color:var(--muted);font-size:12.5px;overflow-wrap:anywhere }
    .perms{ border:1px solid var(--line);border-radius:12px;padding:12px 14px } .perms legend{ padding:0 6px;color:var(--muted);font-size:12px }
    .chk{ display:flex;align-items:center;gap:8px;color:var(--text);font-size:13.5px;padding:4px 0 } .chk input{ width:16px;height:16px }
    .toggles{ display:flex;flex-direction:column;gap:8px }
    .toggle{ display:flex;align-items:center;gap:12px;padding:11px 14px;border:1px solid var(--line);border-radius:12px;background:rgba(255,255,255,.03);color:var(--text);cursor:pointer;font-size:13.5px;text-align:left }
    .toggle .knob{ flex:0 0 40px;width:40px;height:22px;border-radius:999px;background:rgba(255,255,255,.12);position:relative;transition:background var(--dur) }

  <script>
  "use strict";
  // --- Разбор дерева из отступов (├ └ │) ---
  function parseTree(text){
    const root = { name: "__root__", depth: -1, children: [], parent: null };
    const stack = [root];
    for (const raw of text.split("\n")) {
      if (!raw.trim()) continue;
      const idx = raw.search(/[^\s│├└─]/u);
      if (idx < 0) continue;
      const depth = Math.round(idx / 3);
      const name = raw.slice(idx).trim();
      while (stack.length && stack[stack.length - 1].depth >= depth) stack.pop();
      const parent = stack[stack.length - 1] || root;
      const node = { name, depth, children: [], parent };
      parent.children.push(node);
      stack.push(node);
    }
    return root.children[0];
  }

  const ROOT = parseTree(document.getElementById("ia").textContent);

  // id по пути индексов + карта; путь имён для крошек
  const byId = {};
  (function assign(node, path){
    node.id = path;
    byId[path] = node;
    node.children.forEach((c, i) => assign(c, path ? path + "-" + i : String(i)));
  })(ROOT, "0");

  function ancestors(node){ const a=[]; let n=node; while(n && n.parent && n.parent.name!=="__root__"){ a.unshift(n.parent); n=n.parent; } return a; }
  function esc(s){ return String(s).replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c])); }

  /* ═══ ЛИЧНОСТЬ (Фаза 1) ═══════════════════════════════════════════════════
     v2 садится на ТОТ ЖЕ субъект, что оболочка и «Рабочая версия»: те же ключи
     хранилища, тот же порядок, та же ротация токена. Это и есть защита «один
     человек — одна учётка»: свой ключ, свой порядок — иначе на проде уже
     заводилась вторая запись на того же человека (см. start.js). Порт сделан
     с rabochaya/app.js дословно; расходиться им нельзя.
     ЧИТАЕМ на старте, но АНОНИМА НЕ ЗАВОДИМ — предпросмотр не должен плодить
     пустые учётки на каждый заход. Аноним заводится лениво, только когда
     человек сам нажал «Войти». */
  const AUTH_API   = "https://api.agrigate.pro";
  const AUTH_KEY   = "fixar.token";              // ключ оболочки — общий
  const AUTH_ROT   = "fixar.session.rotation";
  const AUTH_KEYS  = ["fixar.token","fixar.start.token","aios_token"];
  const AUTH_LOGIN_STATE = "fixar.login.state";  // одноразовая метка входа (CSRF)
  const AUTH_LOGIN_BACK  = "fixar.login.back";   // куда вернуть после входа
  const AUTH_REDIRECT = "https://agrigate.pro/auth/callback";
  const AUTH_BACK     = "/v2/";                  // добавлен в белый список /auth/callback
  const BRAND = { google:{cls:"g",t:"Google"}, yandex:{cls:"y",t:"Яндекс"}, vk:{cls:"vk",t:"VK ID"},
                  sber:{cls:"s",t:"Сбер ID"}, tbank:{cls:"t",t:"Т-Банк"}, tg:{cls:"tg",t:"Телеграм"} };
  let authState = { token:null, principal:null, assurance:0, signed_in:false, providers:[], name:null, ready:false };

  const store = k => { try { return localStorage.getItem(k); } catch(e){ return null; } };
  const put   = (k,v) => { try { localStorage.setItem(k,v); } catch(e){} };
  const drop  = k => { try { localStorage.removeItem(k); } catch(e){} };

  function meName(){ return authState.signed_in ? (authState.name || (authState.providers||[]).map(p=>(BRAND[p]||{}).t||p).join(" + ") || "вы вошли") : "Гость"; }
  function meInitials(){ if(!authState.signed_in) return "Г"; const n=(authState.name||"").trim(); if(n){ const p=n.split(/\s+/); return ((p[0]||"")[0]||"")+((p[1]||"")[0]||"").toUpperCase(); } const p=(authState.providers||[])[0]; return ((BRAND[p]||{}).t||"В")[0].toUpperCase(); }

  async function authFetch(method, path, body, token){
    const opts = { method, headers:{ "Content-Type":"application/json" } };
    const t = token || authState.token; if(t) opts.headers["Authorization"] = "Bearer " + t;
    if(body!==undefined) opts.body = JSON.stringify(body);
    const r = await fetch(AUTH_API + path, opts);
    const txt = await r.text(); let data=null; try{ data = txt?JSON.parse(txt):null; }catch(e){}
    if(!r.ok){ const e=new Error((data&&data.detail&&(data.detail.message||data.detail.reason))||(typeof (data&&data.detail)==="string"?data.detail:"отказ "+r.status)); e.status=r.status; throw e; }
    return data;
  }
  function fileAsBase64(file){ return new Promise((resolve,reject)=>{ const reader=new FileReader(); reader.onerror=()=>reject(new Error("Не удалось прочитать файл.")); reader.onload=()=>resolve(String(reader.result||"").split(",",2)[1]||""); reader.readAsDataURL(file); }); }
  function newSessionToken(){ if(typeof crypto==="undefined"||!crypto.getRandomValues) return ""; const b=new Uint8Array(32); crypto.getRandomValues(b); let s=""; for(let i=0;i<b.length;i++) s+=b[i].toString(16).padStart(2,"0"); return s; }
  function pendingRotation(old){ try{ const row=JSON.parse(store(AUTH_ROT)||"null"); return row&&row.old===old&&row.replacement?row:null; }catch(e){ return null; } }
  function saveRotation(row){ put(AUTH_ROT, JSON.stringify(row)); return pendingRotation(row.old); }
  function swapSession(old, nw){ AUTH_KEYS.forEach(k=>{ if(store(k)===old) put(k,nw); }); if(authState.token===old) authState.token=nw; }
  function finishRotation(old, nw){ swapSession(old,nw); const row=pendingRotation(old); if(row&&row.replacement===nw) drop(AUTH_ROT); }
  async function askSession(token){ const r=await fetch(AUTH_API+"/entry/whoami",{ headers:{ "Authorization":"Bearer "+token } }); if(!r.ok) return null; const who=await r.json(); return who&&who.principal_id?who:null; }
  async function readSession(token, expect){
    if(!token) return null;
    let pending = pendingRotation(token);
    if(pending){ const rec=await askSession(pending.replacement); if(rec&&rec.principal_id===pending.principal_id){ finishRotation(token,pending.replacement); rec.session_token=pending.replacement; return rec; } }
    const who = await askSession(token); if(!who) return null;
    if(expect && who.principal_id!==expect) return null;
    if(who.session_rotation_required){
      pending = pending || saveRotation({ old:token, replacement:newSessionToken(), principal_id:who.principal_id });
      if(!pending||!pending.replacement){ who.session_token=token; return who; }
      let rr=null;
      try{ rr=await fetch(AUTH_API+"/entry/session/rotate",{ method:"POST", headers:{ "Authorization":"Bearer "+token, "Content-Type":"application/json" }, body:JSON.stringify({replacement_token:pending.replacement}) }); }catch(e){}
      if(rr&&rr.ok){ const rot=await rr.json(); finishRotation(token,pending.replacement); token=pending.replacement; who.session_rotation_required=false; who.session_version=rot.session_version; }
      else { const done=await askSession(pending.replacement); if(done&&done.principal_id===who.principal_id){ finishRotation(token,pending.replacement); done.session_token=pending.replacement; return done; } }
      if(rr&&rr.status===404){ const nb=store(AUTH_KEY); if(!nb||nb===token) return null; return readSession(nb, who.principal_id); }
      if(rr&&rr.status===409){ drop(AUTH_ROT); }
    }
    who.session_token=token; return who;
  }
  function adopt(who){ authState.token=who.session_token||authState.token; authState.principal=who.principal_id; authState.assurance=who.assurance||0; authState.signed_in=!!who.signed_in; authState.providers=who.providers||[]; authState.name=(who.display_name||"").trim()||null; }

  /* Старт: только читаем существующий вход. Ничего не заводим. */
  async function bootIdentity(){
    const saved = store(AUTH_KEY);
    if(saved){ try{ const who=await readSession(saved); if(who&&who.principal_id){ authState.token=who.session_token||saved; adopt(who); } }catch(e){} }
    authState.ready=true; applyIdentity();
  }
  /* Лениво: анонимный вход под общим ключом — точь-в-точь как оболочка (шаг 3). */
  async function ensureSession(){
    if(authState.token) return authState.token;
    const saved=store(AUTH_KEY);
    if(saved){ try{ const who=await readSession(saved); if(who&&who.principal_id){ authState.token=who.session_token||saved; adopt(who); return authState.token; } }catch(e){} }
    const me=await authFetch("POST","/entry/anon",{ label:"v2" });
    authState.token=me.token; authState.principal=me.principal_id; authState.assurance=me.assurance||0;
    put(AUTH_KEY, me.token);
    return authState.token;
  }
  let _providers=null;
  async function authProviders(){ if(_providers) return _providers; _providers=await authFetch("GET","/auth/providers"); return _providers; }

  async function startLogin(provider){
    /* Как в start.js (канонический новый экран): БЕЗ anon_token — это переход
       в существующую запись, а не неполное слияние. Токен для caller получаем
       лениво. Метку и адрес возврата кладём ДО ухода: без метки /auth/callback
       откажет (login CSRF), без адреса — вернёт на «/». */
    await ensureSession();
    const r = await authFetch("POST","/auth/start",{ provider, redirect_uri:AUTH_REDIRECT });
    try{ localStorage.setItem(AUTH_LOGIN_STATE, r.state); localStorage.setItem(AUTH_LOGIN_BACK, AUTH_BACK); }
    catch(e){ throw new Error("Браузер не даёт запомнить начатый вход (приватный режим?). Без этой проверки продолжать небезопасно."); }
    location.href = r.authorize_url || r.url;
  }
  async function logout(){
    try{ if(authState.token) await authFetch("POST","/entry/logout",{ token:authState.token }); }catch(e){}
    drop(AUTH_KEY); drop("fixar.start.token"); drop(AUTH_ROT);
    location.reload();
  }

  /* ── Лист входа: реальные кнопки от /auth/providers, реальный /auth/start ── */
  let _sheet=null, _sheetReturn=null;
  function sheetEl(){
    if(_sheet) return _sheet;
    _sheet=document.createElement("div"); _sheet.className="sheet"; _sheet.setAttribute("role","dialog"); _sheet.setAttribute("aria-modal","true"); _sheet.setAttribute("aria-label","Аккаунт");
    _sheet.innerHTML='<div class="sheet-bg" data-x></div><div class="sheet-card" role="document"><button class="sheet-x" data-x aria-label="Закрыть">✕</button><div id="sheetbody"></div></div>';
    document.body.appendChild(_sheet);
    _sheet.addEventListener("click", e=>{ if(e.target.hasAttribute("data-x")) closeAccount(); });
    document.addEventListener("keydown", e=>{ if(!_sheet.classList.contains("open")) return;
      if(e.key==="Escape"){ e.preventDefault(); closeAccount(); return; }
      if(e.key==="Tab"){ const f=Array.from(_sheet.querySelectorAll('button,[href],input,[tabindex]:not([tabindex="-1"])')).filter(el=>el.offsetParent!==null); if(!f.length) return; const a=f[0],b=f[f.length-1];
        if(e.shiftKey&&document.activeElement===a){ e.preventDefault(); b.focus(); } else if(!e.shiftKey&&document.activeElement===b){ e.preventDefault(); a.focus(); } } });
    return _sheet;
  }
  function closeAccount(){ if(!_sheet) return; _sheet.classList.remove("open"); document.body.style.overflow=""; if(_sheetReturn&&_sheetReturn.focus) _sheetReturn.focus(); }
  async function openAccount(ev){
    _sheetReturn = (ev&&ev.currentTarget)||document.activeElement;
    const s=sheetEl(); const body=s.querySelector("#sheetbody");
    s.classList.add("open"); document.body.style.overflow="hidden";
    if(authState.signed_in){
      const via=(authState.providers||[]).map(p=>'<span class="prov-chip">'+esc((BRAND[p]||{}).t||p)+'</span>').join("");
      body.innerHTML='<h2>'+esc(meName())+'</h2><p class="lead">Вы вошли — это тот же аккаунт и те же дела во всех версиях ФиксАР.</p>'+
        (via?'<div class="prov-chips">'+via+'</div>':'')+
        '<span class="assure">Уровень подтверждения: '+(authState.assurance||0)+'</span>'+
        '<button class="btn-out" id="doLogout">Выйти из аккаунта</button>';
      const lo=body.querySelector("#doLogout"); lo.focus();
      lo.onclick=()=>{ lo.disabled=true; lo.textContent="Выхожу…"; logout(); };
      return;
    }
    body.innerHTML='<h2>Войти в ФиксАР</h2><p class="lead">Вход привязывает канал к вашему субъекту: дела и переписка не потеряются. Пока вы гость — можно смотреть, но не подписывать обязательства и не звать людей в дело.</p><div id="oauths"><span class="sheet-note">Загружаю способы входа…</span></div>';
    let cfg=null; try{ cfg=await authProviders(); }catch(e){ body.querySelector("#oauths").innerHTML='<span class="sheet-note">Способы входа сейчас недоступны. Разговор при этом идёт — дело уже ваше.</span>'; return; }
    if(!s.classList.contains("open")) return;
    const ready=Object.keys(cfg.oauth||{}).filter(k=>cfg.oauth[k]&&BRAND[k]);
    const wrap=body.querySelector("#oauths"); wrap.innerHTML="";
    ready.forEach((k,i)=>{ const b=document.createElement("button"); b.className="oauth"; b.type="button";
      b.innerHTML='<i class="'+esc((BRAND[k]||{}).cls||"")+'">'+esc(((BRAND[k]||{}).t||k)[0])+'</i><span>Войти через '+esc((BRAND[k]||{}).t||k)+'</span>';
      b.onclick=async()=>{ Array.from(wrap.querySelectorAll("button")).forEach(x=>x.disabled=true); b.querySelector("span").textContent="минуту…";
        try{ await startLogin(k); }catch(e){ Array.from(wrap.querySelectorAll("button")).forEach(x=>x.disabled=false); b.querySelector("span").textContent="Войти через "+((BRAND[k]||{}).t||k); toast((e&&e.message)||"Вход сейчас не работает."); } };
      wrap.appendChild(b); if(i===0) b.focus(); });
    const other=[]; if(cfg.email) other.push("почта"); if(cfg.telegram) other.push("Телеграм"); if(cfg.phone) other.push("телефон"); if(cfg.max) other.push("MAX");
    if(other.length) wrap.insertAdjacentHTML("beforeend",'<a class="sheet-other" href="/start/">Другие способы: '+esc(other.join(", "))+' →</a>');
    if(!ready.length&&!other.length) wrap.innerHTML='<span class="sheet-note">Способы входа ещё не настроены на сервере.</span>';
  }
  function toast(msg){ const t=document.createElement("div"); t.className="auth-toast"; t.setAttribute("role","status"); t.textContent=msg; document.body.appendChild(t); setTimeout(()=>{ if(t.parentNode) t.parentNode.removeChild(t); }, 5200); }

  function buildNav(node, container){
    node.children.forEach(child => {
      const row = document.createElement("div"); row.className = "n-row"; row.dataset.id = child.id;
      const caret = document.createElement("button");
      caret.className = "caret" + (child.children.length ? "" : " leaf");
      caret.setAttribute("aria-expanded", "false");
      caret.setAttribute("aria-label", "Развернуть");
      caret.textContent = "▶";
      const label = document.createElement("button");
      label.className = "n-label"; label.textContent = child.name;
      row.append(caret, label); container.appendChild(row);
      let kids = null;
      if (child.children.length){
        kids = document.createElement("div"); kids.className = "kids"; kids.hidden = true;
        container.appendChild(kids);
        buildNav(child, kids);
        caret.addEventListener("click", e => { e.stopPropagation();
          const open = kids.hidden; kids.hidden = !open; caret.setAttribute("aria-expanded", String(open)); });
      }
      label.addEventListener("click", () => { listFilter="Все"; go(child.id); });
      child._row = row; child._caret = caret; child._kids = kids;
    });
  }

  function isListNode(node){ return node.children.length>=3 && node.children.some(c=>/^Все |^Активные$|Завершённые|Черновики|Опубликованные|^Новые$|^Мои /.test(c.name)); }

  const LIST_FILTERS = [ {n:"Все",f:()=>true},{n:"Мои",f:s=>s!=="Завершено"},{n:"Требуют меня",f:s=>s==="Ожидает человека"},{n:"Агенты работают",f:s=>s==="В работе"},{n:"Завершённые",f:s=>s==="Завершено"} ];

    const d=SPACE_DATA[currentSpace]||{}; const raw=(d.projects && /проект|пак/i.test(node.name))?d.projects:(d.cases||[]); return raw.map(it=>({title:it[0],status:statusNorm(it[1]),meta:it[2],seed:it[3]})); }

  function renderCase(fast){
    const cs = activeCase(); if(!cs) return;
    const sp = SPACE_NODES[cs.space] || SPACE_NODES[currentSpace];
    const build = () =>
      '<div class="crumbs"><a href="#'+(sp?sp.id:"0")+'">'+esc(cs.space)+'</a><span class="sep">›</span><span>'+esc(cs.title)+'</span></div>'+
      '<p class="eyebrow" style="color:var(--cyan)">Дело · '+esc(cs.space)+'</p>'+
      '<h1 style="margin:2px 0 0;font-size:28px">'+esc(cs.title)+'</h1>'+
      '<div class="pmeta" style="margin-top:10px">'+statusChip(cs.status)+'<span>Следующий шаг: '+esc(cs.nextStep)+'</span><span>Ответственный: '+esc(cs.responsible)+'</span><span>Срок: '+esc(cs.deadline)+'</span><span>Прогресс '+cs.progress+'%</span></div>'+
      '<div class="case-tabs" id="ctabs">'+CASE_TABS.map(t=>'<button class="ct'+(t===caseTab?" active":"")+'" data-tab="'+esc(t)+'">'+esc(t)+'</button>').join("")+'</div>'+
      '<div id="casepanel">'+caseTabPanel(cs,caseTab)+'</div>';
    if (fast){ vwrap.innerHTML = build(); vwrap.parentElement.scrollTop = 0; bindCase(); }
    else { loadThen(build, skeletonCase(), bindCase); }
  }

  function bumpProgress(cs){ const all=cs.plan.flatMap(s=>s.tasks); const done=all.filter(t=>t.status==="done").length; cs.progress=Math.round(done/all.length*100); }
  function bindCase(){
    const tabs=document.getElementById("ctabs"); if(!tabs) return;
    tabs.onclick=e=>{ const b=e.target.closest(".ct"); if(!b)return; caseTab=b.dataset.tab; renderCase(true); };
    const panel=document.getElementById("casepanel");
    panel.onclick=e=>{
      const b=e.target.closest("[data-act]"); if(!b)return; const cs=activeCase(); const act=b.dataset.act;
      if(act==="goto-settings"){ caseTab="Настройки"; renderCase(true); }
      else if(act==="goto-plan"){ caseTab="План"; renderCase(true); }
      else if(act==="open-linked"){ routeCase(b.dataset.id); }
      else if(act==="task-done"){ cs.plan[+b.dataset.s].tasks[+b.dataset.t].status="done"; bumpProgress(cs); renderCase(true); }
      else if(act==="toggle-watch"){ cs.agentWatch=!cs.agentWatch; renderCase(true); }

  function bindRealPanel(){

      const cp=e.target.closest("[data-copy]"); if(cp){ try{ await navigator.clipboard.writeText(cp.dataset.copy); toast("Ссылка скопирована"); }catch(_){ toast("Скопируйте ссылку вручную"); } return; }

      if(act==="draft-external"){ b.disabled=true; try{ const r=await authFetch("POST","/drafts/"+encodeURIComponent(b.dataset.id)+"/external-share",{}); const link=location.origin+"/document/"+encodeURIComponent(r.token); await navigator.clipboard.writeText(link); toast("Внешняя ссылка скопирована. Просмотр доступен 7 дней; редактирование — после регистрации и приглашения."); }catch(err){ b.disabled=false; toast((err&&err.message)||"Не удалось создать ссылку."); } return; }
      if(act==="edit-see"){ openMaySee(c.id,b.dataset.pid); return; }
      if(act==="grant-agent"){ openRunConsent(c.id); return; }

      if(act==="state"){ const st=b.dataset.state; const nm={closed:"завершить",archived:"архивировать",active:"возобновить"}; if(!window.confirm("Точно "+(nm[st]||st)+" это дело?")) return; b.disabled=true;
        try{ await authFetch("POST","/cases/"+encodeURIComponent(c.id)+"/state",{target_state:st,reason:"смена статуса из предпросмотра v2"}); REAL.loaded=false; renderRealCase(c.id); }

    };
    panel.onsubmit=async e=>{
      const f=e.target.closest("form[data-act]"); if(!f) return; e.preventDefault(); const c=activeReal.c;
      if(f.dataset.act==="invite"){
        const rights=[...f.querySelectorAll('input[name="right"]:checked')].map(x=>x.value); if(rights.indexOf("read")<0) rights.unshift("read");
        const may_see=[...f.querySelectorAll('input[name="see"]:checked')].map(x=>x.value); if(may_see.indexOf("normal")<0) may_see.unshift("normal");
        const btn=f.querySelector('button[type="submit"]'); btn.disabled=true; btn.textContent="Создаю…";
        try{ const r=await authFetch("POST","/cases/"+encodeURIComponent(c.id)+"/invites",{role:f.role.value,rights,may_see,engagement:f.engagement.value,note:(f.note.value||"").trim()});
          const link=location.origin+"/?invite="+encodeURIComponent(r.code);
          document.getElementById("inviteout").innerHTML='<div class="invite-box">Приглашение готово ('+esc(String(r.expires_in_hours||72))+' ч). Отправьте ссылку человеку:<code>'+esc(link)+'</code><div class="cta-row"><button class="btn small" type="button" data-copy="'+attr(link)+'">Копировать</button></div></div>';
          btn.disabled=false; btn.textContent="Создать приглашение";
        }catch(err){ btn.disabled=false; btn.textContent="Создать приглашение"; toast((err&&err.message)||"Не удалось создать приглашение."); }
        return;
      }
      if(f.dataset.act==="scope"){ const v=f.querySelector('input[name="scope"]:checked'); if(!v) return; const btn=f.querySelector("button"); btn.disabled=true;
        try{ await authFetch("POST","/cases/"+encodeURIComponent(c.id)+"/scope",{scope:v.value}); REAL.loaded=false; renderRealCase(c.id); }
        catch(err){ btn.disabled=false; toast((err&&err.message)||"Не удалось сменить пространство."); } return; }
      if(f.dataset.act==="draft-create"){ const btn=f.querySelector("button"); btn.disabled=true; btn.textContent="Сохраняю…";
        try{ await authFetch("POST","/cases/"+encodeURIComponent(c.id)+"/drafts",{title:(f.title.value||"").trim(),body:(f.body.value||"").trim(),basis:"текст владельца из v2",kind:"document"}); realTab="Документы"; renderRealCase(c.id); }
        catch(err){ btn.disabled=false; btn.textContent="Сохранить версию"; toast((err&&err.message)||"Не удалось сохранить документ."); } return; }
      if(f.dataset.act==="textbook-upload"){
        const file=f.book.files&&f.book.files[0], btn=f.querySelector('button[type="submit"]'), status=f.querySelector("[data-book-status]");
        if(!file)return; if(file.size>64*1024*1024){ status.textContent="Файл больше 64 МБ."; return; }
        if(f.share.checked && f.rights_basis.value==="open_license" && !f.license_url.value.trim()){ status.textContent="Укажите ссылку на открытую лицензию."; return; }
        btn.disabled=true; btn.classList.add("thinking"); btn.textContent="Загружаю…"; status.textContent="Книга сохраняется в приватном хранилище…";
        try{
          const content_b64=await fileAsBase64(file);
          const saved=await authFetch("POST","/vault/documents",{title:file.name||"Учебник",content_b64,mime:file.type||"application/pdf",kind:"file",sensitivity:"pii",source_case_id:c.id});
          const documentId=saved&&saved.document&&saved.document.id; if(!documentId)throw new Error("Хранилище не вернуло номер документа.");
          await authFetch("POST","/cases/"+encodeURIComponent(c.id)+"/materials",{kind:"file",mime:file.type||"application/pdf",title:file.name||"Учебник",storage_ref:"vault:"+documentId,sensitivity:"pii"});
          const textbook=await authFetch("POST","/homework/textbooks",{child_id:f.child.value,vault_document_id:documentId,subject:f.subject.value.trim(),title:file.name||"Учебник",sensitivity:"pii"});
          status.textContent="Извлекаю текст учебника…";
          const extracted=await authFetch("POST","/homework/textbooks/"+encodeURIComponent(textbook.id)+"/extract",{});
          let message=extracted.status==="ready"?"Учебник загружен и готов для разбора заданий.":"Учебник сохранён, но для этого PDF потребуется уточнение или распознавание.";
          if(f.share.checked){ await authFetch("POST","/homework/textbooks/"+encodeURIComponent(textbook.id)+"/share-proposals",{rights_basis:f.rights_basis.value,license_url:f.license_url.value.trim(),attested:true}); message+=" Заявка в общий корпус отправлена на проверку прав."; }
          activeReal.textbookStatus=message; status.textContent=message; f.reset(); const fields=f.querySelector("[data-share-fields]"); if(fields)fields.hidden=true; const name=f.querySelector(".book-file-name"); if(name)name.textContent="Файл не выбран";
        }catch(err){ status.textContent=(err&&err.message)||"Не удалось загрузить учебник."; }
        finally{ btn.disabled=false; btn.classList.remove("thinking"); btn.textContent="Загрузить и разобрать"; }
        return;
      }
      if(f.dataset.act==="ask-agent"){
        const input=f.querySelector('[name="message"]'), btn=f.querySelector("button"), message=(input.value||"").trim(); if(!message)return; btn.disabled=true; btn.classList.add("thinking"); btn.setAttribute("aria-busy","true");
        try{ await askCaseAgent(message); input.value=""; drawRealCase(); }
        catch(err){ toast((err&&err.message)||"Агент пока не ответил. Повторите позже."); btn.disabled=false; btn.classList.remove("thinking"); btn.removeAttribute("aria-busy"); } return;
      }
    };
  }

  function applyAgentAction(action){

    if(allowed[action.type]){ realTab=allowed[action.type]; drawRealCase(); return true; }
    if(action.type==="switch_space" && SPACE_NODES[action.space]){ switchSpace(action.space); return true; }

  function realDashStrip(){
    const rc=realCasesForSpace(currentSpace); const top=rc.slice(0,4);
    const rows=top.length?top.map(c=>'<div class="rc-row" data-id="'+attr(c.id)+'"><b>'+esc(c.title||"Без названия")+'</b>'+statusChip(statusNorm(RU_STATE[c.state]||"в работе"))+'<span class="when">'+esc(fmtWhen(c.updated_at))+'</span></div>').join("")
      :'<p class="rc-hint">У вас пока нет настоящих дел в этом пространстве.</p>';
    const fixar=(currentSpace==="Личное"||currentSpace==="Семья")?'<button class="btn" data-act="fixar-case">Начать с FixAR</button>':'';
    return '<div class="rc-strip"><h3>Ваши дела · '+esc(currentSpace)+' ('+rc.length+')</h3>'+rows+'<div class="cta-row" style="margin-top:10px"><button class="btn primary" data-act="create-case">Создать дело</button>'+fixar+'</div></div>';
  }
  function refreshCurrentView(){ const h=location.hash.slice(1); if(h.indexOf("case/")===0||h==="demo/states") return; const t=h.indexOf("~"); const id=t>=0?h.slice(0,t):h; const node=byId[id]; if(node) render(node); }

  /* ── Общий модальный лист (для создания дела и правки доступа) ── */
  let _m=null,_mReturn=null;
  function modalOpen(title,html,onMount){
    if(!_m){ _m=document.createElement("div"); _m.className="sheet"; _m.setAttribute("role","dialog"); _m.setAttribute("aria-modal","true");
      _m.innerHTML='<div class="sheet-bg" data-mx></div><div class="sheet-card"><button class="sheet-x" data-mx aria-label="Закрыть">✕</button><div id="mbody"></div></div>';
      document.body.appendChild(_m);
      _m.addEventListener("click",e=>{ if(e.target.hasAttribute("data-mx")) modalClose(); });
      document.addEventListener("keydown",e=>{ if(_m.classList.contains("open")&&e.key==="Escape"){ e.preventDefault(); modalClose(); } });
    }
    _mReturn=document.activeElement;
    _m.querySelector("#mbody").innerHTML='<h2>'+esc(title)+'</h2>'+html;
    _m.classList.add("open"); document.body.style.overflow="hidden";
    if(onMount) onMount(_m.querySelector("#mbody"));
  }
  function modalClose(){ if(_m){ _m.classList.remove("open"); document.body.style.overflow=""; } if(_mReturn&&_mReturn.focus) _mReturn.focus(); }

  // ===== P5: состояния — загрузка / пусто / ошибка =====
  let loadToken = 0;
  function loadThen(build, skel, after, ms){
    const t = ++loadToken; vwrap.innerHTML = skel; vwrap.parentElement.scrollTop = 0;
    setTimeout(()=>{ if(t!==loadToken) return; vwrap.innerHTML = build(); vwrap.parentElement.scrollTop = 0; if(after) after(); }, ms||300);
  }
  const skelCard = n => '<div class="sk-card"><div class="sk sk-title"></div>'+Array.from({length:n||3}).map((_,i)=>'<div class="sk sk-line '+["w80","w60","w40"][i%3]+'"></div>').join("")+'</div>';
  const skeletonDash = head => head+'<div class="dash">'+skelCard(4)+skelCard(3)+skelCard(3)+skelCard(3)+skelCard(2)+'</div>';
  const skeletonList = head => head+'<div class="lbar sticky"><div class="tabs filter-bar">'+Array.from({length:5}).map(()=>'<span class="sk" style="height:32px;width:100px;border-radius:999px"></span>').join("")+'</div></div><div class="lst">'+Array.from({length:4}).map(()=>'<div style="padding:16px;border-bottom:1px solid var(--line-soft)"><div class="sk sk-line w40" style="height:15px"></div><div class="sk sk-line w60"></div></div>').join("")+'</div>';
  const skeletonCase = () => '<div class="sk" style="height:26px;width:52%;margin-bottom:16px;border-radius:10px"></div><div class="sk" style="height:14px;width:70%;margin-bottom:18px;border-radius:8px"></div>'+skelCard(6);
  function emptyState(emoji,title,text,ctaLabel,ctaAttr){ return '<div class="empty"><div class="emoji" aria-hidden="true">'+emoji+'</div><h3>'+esc(title)+'</h3><p>'+esc(text)+'</p>'+(ctaLabel?'<button class="btn primary" '+(ctaAttr||"")+'>'+esc(ctaLabel)+'</button>':'')+'</div>'; }
  function errorBox(msg,retryAttr){ return '<div class="errbox"><span class="ic" aria-hidden="true">!</span><div><b>Не удалось загрузить</b><p>'+esc(msg)+'</p><button class="btn" '+(retryAttr||"")+'>Повторить</button></div></div>'; }
  function renderStatesDemo(){
    const homeId = kidOf(SPACE_NODES[currentSpace],"Главная");
    vwrap.innerHTML = '<div class="crumbs"><span>Прототип</span><span class="sep">›</span><span>Состояния экранов</span></div>'+
      '<div class="vhead"><p class="eyebrow">Прототип</p><h1>Состояния экранов</h1><p>Как выглядят загрузка, пустой экран и ошибка.</p></div>'+
      '<div class="demo-grid">'+
        '<div class="demo-cell" id="demoLoad"><h4>Загрузка</h4>'+skelCard(4)+'</div>'+
        '<div class="demo-cell"><h4>Пусто</h4>'+emptyState("🗂","Пока нет дел","Здесь появятся ваши дела. Начните с готового пака или создайте дело.","Создать дело","onclick=\"go('"+homeId+"')\"")+'</div>'+
        '<div class="demo-cell" id="demoErr"><h4>Ошибка</h4>'+errorBox("Проверьте соединение и попробуйте ещё раз.","data-act=\"demo-retry\"")+'</div>'+
      '</div>';
    vwrap.parentElement.scrollTop = 0;
    const t=++loadToken, dl=document.getElementById("demoLoad");
    setTimeout(()=>{ if(t!==loadToken||!dl||!dl.isConnected) return; dl.innerHTML='<h4>Загрузка → готово</h4><div class="row"><b>Ремонт в ванной</b><span class="chip">В работе</span></div><div class="row"><b>Школа Миши</b><span class="chip warn">Ожидает человека</span></div><div class="row"><b>Поездка</b><span class="chip">В работе</span></div>'; },1300);
    document.getElementById("demoErr").addEventListener("click",e=>{ if(!e.target.closest('[data-act="demo-retry"]'))return; const cell=document.getElementById("demoErr");
      cell.innerHTML='<h4>Повтор…</h4>'+skelCard(3);
      setTimeout(()=>{ if(!cell.isConnected)return; cell.innerHTML='<h4>Ошибка → успех</h4><div class="row"><b>Данные загрузились</b><span class="chip">ок</span></div><div class="row"><b>Соединение восстановлено</b><span class="chip">ок</span></div>'; },900); });
  }

  function render(node){
    const custom = SCREENS[pathKey(node)];
    if (custom){ vwrap.innerHTML = custom(node); vwrap.parentElement.scrollTop = 0; bindScreen(); return; }
    const isMain = node.name==="Главная";
    let head = '<div class="crumbs">'+crumbHtml(node)+'</div>'+
      '<div class="vhead"><p class="eyebrow">'+esc(isMain?currentSpace:eyebrowFor(node))+'</p><h1>'+esc(isMain?("Главная — "+currentSpace):node.name)+'</h1>';
    if (isMain){
      head += '<p>Ваше пространство «'+esc(currentSpace)+'»: важное, дела и сроки под наблюдением агентов.</p></div>';
      loadThen(()=>head+dashboard(node), skeletonDash(head), ()=>{ bindScreen(); if(currentSpace==="Практика"&&(!PRACTICE.loaded||PRACTICE.principal!==authState.principal)) loadPracticeCabinets().then(refreshCurrentView); }); return;
    } else if (isListNode(node)){
      head += '<p>Фильтр по состоянию · клик открывает дело.</p></div>';
      loadThen(()=>head+renderList(node), skeletonList(head), bindScreen); return;
    } else if (node.children.length){
      head += '<p>Раздел «'+esc(node.name)+'» · '+node.children.length+' пункт(ов).</p></div>';
      vwrap.innerHTML = head+tileGrid(node);
    } else {
      head += '</div><div class="stub"><span class="tag">Экран · дизайн v2</span><p>«'+esc(node.name)+'» — конечный экран в дизайне v2 (форма, список или карточка).</p></div>';
      vwrap.innerHTML = head;
    }
    vwrap.parentElement.scrollTop = 0;
    bindScreen();
  }

  // --- Роутинг ---
  function go(id){
    const node = byId[id]; if (!node) return;
    const sp = spaceOf(node);
    if (sp && sp !== currentSpace){ currentSpace = sp; rebuildNav(); }
    if ((location.hash.slice(1).split("~")[0]) !== id) location.hash = "#"+id;
    expandTo(node); render(node);
    closeNav();
  }
  window.go = go;
  window.addEventListener("hashchange", () => {
    const h = location.hash.slice(1);
    if (h==="demo/states"){ renderStatesDemo(); return; }
    if (h.indexOf("case/")===0){ routeCase(h.slice(5)); return; }
    const t=h.indexOf("~"); const id=t>=0?h.slice(0,t):h; listFilter = t>=0 ? decodeURIComponent(h.slice(t+1)) : "Все";
    if (byId[id]) go(id);
  });

  // --- Поиск ---
  document.getElementById("q").addEventListener("input", e => {
    const term = e.target.value.trim().toLowerCase();
    document.querySelectorAll(".n-row").forEach(row => {
      const n = byId[row.dataset.id]; const hit = !term || n.name.toLowerCase().includes(term);
      row.style.display = hit ? "" : "none";
      if (hit && term){ ancestors(n).forEach(a => { if (a._kids){ a._kids.hidden=false; if(a._caret) a._caret.setAttribute("aria-expanded","true"); } if (a._row) a._row.style.display=""; }); }
    });
  });

  // --- Мобильное меню (drawer): вне/Escape закрывают, скролл блокируется, фокус ловится и возвращается ---
  const menu = document.getElementById("menu"), scrim = document.getElementById("scrim"), side = document.getElementById("side");
  scrim.hidden = false;
  function focusables(){ return Array.from(side.querySelectorAll('input,button,[href],[tabindex]:not([tabindex="-1"])')).filter(el=>el.offsetParent!==null); }
  function openNav(){ document.body.classList.add("nav-open"); menu.setAttribute("aria-expanded","true"); const f=focusables()[0]; if(f) f.focus(); }
  function closeNav(){ const was=document.body.classList.contains("nav-open"); document.body.classList.remove("nav-open"); menu.setAttribute("aria-expanded","false"); if(was && menu.offsetParent) menu.focus(); }
  window.closeNav = closeNav;
  menu.addEventListener("click", () => document.body.classList.contains("nav-open") ? closeNav() : openNav());
  scrim.addEventListener("click", closeNav);
  document.addEventListener("keydown", e => {
    if (!document.body.classList.contains("nav-open")) return;
    if (e.key === "Escape"){ e.preventDefault(); closeNav(); return; }
    if (e.key === "Tab"){ const f=focusables(); if(!f.length) return; const first=f[0], last=f[f.length-1];
      if (e.shiftKey && document.activeElement===first){ e.preventDefault(); last.focus(); }
      else if (!e.shiftKey && document.activeElement===last){ e.preventDefault(); first.focus(); } }
  });

  // Композер (демо): «Отправить» добавляет реплику и канонический ответ — кнопка не «мёртвая»
  async function composerSend(comp){
    const inp=comp.querySelector("input"); const v=(inp.value||"").trim(); if(!v) return;
    if(currentSpace==="Семья"){ await openFamilyDialog(v); return; }
    const mk=(cls,html)=>{ const d=document.createElement("div"); d.className="bubble"+(cls?" "+cls:""); d.innerHTML=html; return d; };
    comp.parentElement.insertBefore(mk("user", esc(v)), comp); inp.value="";
    setTimeout(()=>{ comp.parentElement.insertBefore(mk("", "Это демо-экран: в рабочей версии запрос уйдёт агенту дела. <small>ФиксАР · сейчас</small>"), comp); comp.scrollIntoView({block:"nearest"}); }, 300);
  }
  document.getElementById("view").addEventListener("click", e=>{ const b=e.target.closest(".composer button"); if(b){ e.preventDefault(); composerSend(b.closest(".composer")); } });
  document.getElementById("view").addEventListener("keydown", e=>{ if(e.key==="Enter"){ const i=e.target.closest(".composer input"); if(i){ e.preventDefault(); composerSend(i.closest(".composer")); } } });

  // Аккаунт: триггеры (мобильная шапка + подвал навигации) и загрузка личности
  document.getElementById("acct").addEventListener("click", openAccount);
  document.getElementById("protofoot").addEventListener("click", e=>{ const b=e.target.closest('[data-acct="open"]'); if(b){ e.preventDefault(); openAccount(e); } });
  // Реальные дела: создание и переход из дашборд-полоски (делегируем на #view)
  document.getElementById("view").addEventListener("click", e=>{ const fixar=e.target.closest('[data-act="fixar-case"]'); if(fixar){ e.preventDefault(); openFixarCase(); return; } const cc=e.target.closest('[data-act="create-case"]'); if(cc){ e.preventDefault(); openCreateCase(); return; } const add=e.target.closest('[data-act="practice-add"]'); if(add){ e.preventDefault(); openPracticeAdd(); return; } const reload=e.target.closest('[data-act="practice-reload"]'); if(reload){ e.preventDefault(); loadPracticeCabinets(true).then(refreshCurrentView); return; } const selected=e.target.closest('[data-act="practice-select"]'); if(selected){ PRACTICE.selectedId=selected.dataset.id; try{localStorage.setItem(practiceStorageKey(),PRACTICE.selectedId);}catch(_){} refreshCurrentView(); return; } const rr=e.target.closest('.rc-strip .rc-row[data-id]'); if(rr){ realTab="Обзор"; location.hash="#case/"+rr.dataset.id; } });
  const agentDock=document.getElementById("agentdock"), agentDockToggle=document.getElementById("agentdocktoggle");
  function setAgentDockCompact(compact){ agentDock.classList.toggle("compact",compact); agentDockToggle.setAttribute("aria-expanded",String(!compact)); agentDockToggle.querySelector("span").textContent=compact?"Открыть":"Свернуть"; try{ localStorage.setItem("fixar-v2-agent-dock-compact",compact?"1":"0"); }catch(_){} }
  let savedDock; try{ savedDock=localStorage.getItem("fixar-v2-agent-dock-compact"); }catch(_){} setAgentDockCompact(savedDock===null?window.matchMedia("(max-width: 760px)").matches:savedDock==="1");
  agentDockToggle.addEventListener("click",()=>setAgentDockCompact(!agentDock.classList.contains("compact")));
  document.getElementById("agentdockform").addEventListener("submit",async e=>{ e.preventDefault(); const f=e.currentTarget, input=f.elements.message, answer=document.getElementById("agentdockanswer"), button=f.querySelector("button"), message=(input.value||"").trim(); if(!message)return; button.disabled=true; button.classList.add("thinking"); button.setAttribute("aria-busy","true"); answer.textContent="Агент думает…";
    try{ answer.textContent=await askCaseAgent(message); input.value=""; }catch(err){ answer.textContent=(err&&err.message)||"Агент пока не ответил."; }finally{ button.disabled=false; button.classList.remove("thinking"); button.removeAttribute("aria-busy"); } });
  document.addEventListener("input",e=>{ const field=e.target.closest("textarea[name=message]"); if(!field)return; field.style.height="auto"; field.style.height=Math.min(field.scrollHeight,180)+"px"; });
  bootIdentity();

  // старт
  (function(){ const h=location.hash.slice(1);
    if (h==="demo/states"){ renderStatesDemo(); return; }
    if (h.indexOf("case/")===0){ routeCase(h.slice(5)); return; }
    const t=h.indexOf("~"); const id=t>=0?h.slice(0,t):h; if(t>=0) listFilter=decodeURIComponent(h.slice(t+1));
    go(byId[id] ? id : kidOf(SPACE_NODES[currentSpace],"Главная"));
  })();
  </script>
</body>
</html>
