<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>ФиксАР</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
</head>
<!--
  ПРЕЖНИЙ АДРЕС ПЕРВОГО ЭКРАНА. С 06.09.2026 экран живёт в корне; здесь
  остаётся форвард, потому что ссылки вида `/start/#вещь=…` уже выданы людям
  и уехали в переписку — ломать их ради стройности неправильно.

  ФРАГМЕНТ ПЕРЕЕЗЖАЕТ РУКАМИ. Браузер сохраняет хеш при 3xx, но не при
  переходе на другой путь из сценария: `location.replace("/")` отбросил бы
  `#вещь=…`, и принявший вещь попал бы на общий экран вместо своей.

  `replace`, а не `href`: иначе «назад» возвращает сюда, а отсюда снова
  бросает вперёд, и выйти назад нельзя.
-->
<body>
<script>
(function () {
  "use strict";
  location.replace("/" + (location.hash || ""));
})();
</script>
</body>
</html>
